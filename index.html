<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyNotes - 每日学习记录</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <!-- 登录界面 -->
  <div id="login-container" class="container">
    <h1>📚 StudyNotes</h1>
    <p style="text-align:center; color:#666; margin-bottom:20px;">个人学习进度记录</p>
    <form id="login-form">
      <input type="email" id="email" placeholder="邮箱" required>
      <input type="password" id="password" placeholder="密码" required>
      <button type="submit">登录</button>
    </form>
  </div>

  <!-- 主面板（登录后显示） -->
  <div id="dashboard-container" class="container hidden">
    <div class="header-bar">
      <h1>📚 StudyNotes</h1>
      <div>
        <a href="share.html" target="_blank" class="btn-link">查看分享页</a>
        <button id="logout-btn" class="btn-secondary">退出登录</button>
      </div>
    </div>

    <!-- 统计数据 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="total-days">0</div>
        <div class="stat-label">总完成天数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="current-streak">0</div>
        <div class="stat-label">当前连续打卡</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="max-streak">0</div>
        <div class="stat-label">最长连续打卡</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="total-notes">0</div>
        <div class="stat-label">笔记总数</div>
      </div>
    </div>

    <!-- 日历热力图 -->
    <div class="section">
      <h2>🔥 学习热力图</h2>
      <div class="heatmap-wrapper">
        <div id="heatmap-grid" class="heatmap-grid"></div>
      </div>
    </div>

    <!-- 添加记录 -->
    <div class="section">
      <h2>✍️ 添加今日记录</h2>
      <form id="record-form">
        <div class="form-row">
          <label>日期：</label>
          <input type="date" id="record-date" required>
          <label style="margin-left:20px;">状态：</label>
          <input type="checkbox" id="record-completed"> 已完成
        </div>
        <textarea id="record-content" rows="4" placeholder="记录你的学习心得、笔记（支持 Markdown 语法）..."></textarea>
        <div class="form-row">
          <label>上传图片：</label>
          <input type="file" id="record-images" accept="image/*" multiple>
        </div>
        <button type="submit" class="btn-primary">保存记录</button>
      </form>
    </div>

    <!-- 历史记录列表 -->
    <div class="section">
      <h2>📝 历史记录</h2>
      <div id="records-list"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
